<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alice van Wouw — Work</title>
  <style>
    :root {
      --bg: #f7f3ea;
      --text: #4b4438;
      --muted: #7a7264;
      --line: #ddd3c1;
      --max-width: 1280px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .container {
      width: min(var(--max-width), calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247,243,234,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      min-height: 92px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 6px 16px 10px;
    }

    .nav {
      display: flex;
      gap: 24px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav.left { justify-content: flex-start; }
    .nav.right { justify-content: flex-end; }

    .brand {
      text-align: center;
      position: relative;
      display: inline-block;
    }

    .brand img {
      max-height: 72px;
      width: auto;
      display: inline-block;
    }

    .brand p {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 1px;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
      pointer-events: none;
      white-space: nowrap; /* keep on one line */
    }

    .page-header {
      padding: 34px 0 28px;
      border-bottom: 1px solid var(--line);
    }

    .page-header-inner {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 32px;
      align-items: end;
    }

    .page-title {
      margin: 0;
      font-size: clamp(30px, 3.8vw, 48px);
      letter-spacing: 0.04em;
      font-weight: 400;
    }

    .page-copy {
      margin: 0;
      max-width: 620px;
      font-size: 16px;
      line-height: 1.9;
      color: var(--muted);
    }

    .work-section {
      padding: 28px 0 56px;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 18px;
      align-items: start;
    }

    .work-item {
      display: block;
    }

    .work-image {
      overflow: hidden;
      background: transparent;
      aspect-ratio: 4 / 5;
    }

    .work-item.portrait .work-image {
      aspect-ratio: 4 / 5;
    }

    .work-item.square .work-image {
      aspect-ratio: 1 / 1;
    }

    .work-item.tall .work-image {
      aspect-ratio: 3 / 4.3;
    }

                footer {
      border-top: 1px solid var(--line);
      padding: 42px 0 56px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      width: min(var(--max-width), calc(100% - 32px));
      margin: 0 auto;
    }

    .footer-brand {
      font-size: 32px;
      letter-spacing: 0.12em;
      margin: 0;
      font-weight: normal;
    }

    .footer-copy {
      max-width: 520px;
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.8;
      color: var(--muted);
    }

    .footer-meta {
      font-size: 14px;
      line-height: 2;
      color: var(--muted);
      text-align: right;
    }

    @media (max-width: 980px) {
      .topbar-inner,
      .page-header-inner,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .nav { display: none; }

      .brand {
        padding: 12px 0;
      }

      .work-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .footer-meta {
        text-align: left;
      }
    }

    @media (max-width: 640px) {
      .container {
        width: min(var(--max-width), calc(100% - 20px));
      }

      .page-header {
        padding: 24px 0 22px;
      }

      .page-copy,
      .footer-copy {
        font-size: 15px;
      }

      .work-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <nav class="nav left">
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="brand">
         <img src="images/Alice_van_Wouw_Logo.png"  alt="Alice van Wouw" style="max-height:72px; width:auto; display:inline-block;" />
        <p>Fine Art · Illustration</p>
      </div>

      <nav class="nav right">
        <a href="#store">Store</a>
        <a href="#work">Work</a>
        <a href="#sketchbook">Sketchbook</a>
      </nav>
    </div>
  </header>

  <main>
    

    <section class="work-section">
      <div class="container work-grid">
        <a href="#work-item-1" class="work-item tall">
          <div class="work-image">
            <img src="https://images.unsplash.com/photo-1518998053901-5348d3961a04?auto=format&fit=crop&w=1200&q=80" alt="Work 1" />
          </div>
          
        </a>

        <a href="#work-item-2" class="work-item square">
          <div class="work-image">
            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1200&q=80" alt="Work 2" />
          </div>
          
        </a>

        <a href="#work-item-3" class="work-item portrait">
          <div class="work-image">
            <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=1200&q=80" alt="Work 3" />
          </div>
          
        </a>

        <a href="#work-item-4" class="work-item square">
          <div class="work-image">
            <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1200&q=80" alt="Work 4" />
          </div>
          
        </a>

        <a href="#work-item-5" class="work-item tall">
          <div class="work-image">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80" alt="Work 5" />
          </div>
          
        </a>

        <a href="#work-item-6" class="work-item portrait">
          <div class="work-image">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" alt="Work 6" />
          </div>
          
        </a>

        <a href="#work-item-7" class="work-item portrait">
          <div class="work-image">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80" alt="Work 7" />
          </div>
          
        </a>

        <a href="#work-item-8" class="work-item square">
          <div class="work-image">
            <img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1200&q=80" alt="Work 8" />
          </div>
          
        </a>

        <a href="#work-item-9" class="work-item tall">
          <div class="work-image">
            <img src="https://images.unsplash.com/photo-1470115636492-6d2b56f9146d?auto=format&fit=crop&w=1200&q=80" alt="Work 9" />
          </div>
          
        </a>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-grid">
      <div>
        <h3 class="footer-brand">Alice van Wouw</h3>
        <p class="footer-copy">
          Fine art and illustration — originals, commissions, and archival prints.
        </p>
      </div>

      <div class="footer-meta">
        <div>hello@alicevanwouw.com</div>
        <div>Johannesburg, South Africa</div>
        <div>Instagram / Shop / Contact</div>
      </div>
    </div>
  </footer>
</body>
</html>
