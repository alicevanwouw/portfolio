<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alice van Wouw — Store</title>
  <style>
    :root {
      --bg: #f7f3ea;
      --text: #4b4438;
      --muted: #7a7264;
      --line: #ddd3c1;
      --max-width: 1280px;
    }

    * { box-sizing: border-box; }

									 
    html { scroll-behavior: smooth; }
		  
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
    }

							
					 
	 

		 
    img {
				  
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      width: min(var(--max-width), calc(100% - 32px));
      margin: 0 auto;
    }

    /* HEADER */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247,243,234,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      min-height: 92px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 6px 16px 10px;
    }

    .nav {
      display: flex;
      gap: 24px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav.left { justify-content: flex-start; }
    .nav.right { justify-content: flex-end; }

    .brand {
      text-align: center;
      position: relative;
      display: inline-block;
    }

	
    .brand img {
      max-height: 72px;
      width: auto;
      display: inline-block;
    }

    
    .brand p {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 1px;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
      pointer-events: none;
      white-space: nowrap;
    }

    /* STORE LAYOUT */
    .store-section {
      padding: 60px 0 80px;
    }

    .store-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .store-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .store-image {
      height: 420px;
      overflow: hidden;
    }

    .store-title {
      font-size: clamp(28px, 3.5vw, 42px);
      letter-spacing: 0.05em;
      font-weight: normal;
    }

    

    .store-link:hover {
      color: var(--text);
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .nav { display: none; }

      .store-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .store-image {
        height: 320px;
      }
    }
  </style>
  <style>
    /* FOOTER */
    footer {
      border-top: 1px solid var(--line);
      padding: 42px 0 56px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      width: min(var(--max-width), calc(100% - 32px));
      margin: 0 auto;
    }

    .footer-brand {
      font-size: 32px;
      letter-spacing: 0.12em;
      margin: 0;
      font-weight: normal;
    }

    .footer-copy {
      max-width: 520px;
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.8;
      color: var(--muted);
    }

    .footer-meta {
      font-size: 14px;
      line-height: 2;
      color: var(--muted);
      text-align: right;
    }

    @media (max-width: 768px) {
      .footer-grid { grid-template-columns: 1fr; }
      .footer-meta { text-align: left; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <nav class="nav left">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="brand">
       <img src="images/Alice_van_Wouw_Logo.png"  alt="Alice van Wouw" style="max-height:72px; width:auto; display:inline-block;" />
      <p>Fine Art · Illustration</p>
    </div>

    <nav class="nav right">
      <a href="store.html">Store</a>
      <a href="work.html">Work</a>
      <a href="sketchbook.html">Sketchbook</a>
    </nav>
  </div>
</header>

<main>
  <section class="store-section">
    <div class="container store-grid">

      <a href="#originals" class="store-card">
        <div class="store-image">
          <img src="https://images.unsplash.com/photo-1518998053901-5348d3961a04?auto=format&fit=crop&w=1400&q=80" alt="Originals" />
        </div>
        <div class="store-title">Originals</div>
        
      </a>

      <a href="#prints" class="store-card">
        <div class="store-image">
          <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1400&q=80" alt="Prints" />
        </div>
        <div class="store-title">Prints</div>
        
      </a>

    </div>
  </section>
</main>

<footer id="contact">
  <div class="footer-grid">
    <div>
      <h3 class="footer-brand">Alice van Wouw</h3>
      <p class="footer-copy">
        Fine art and illustration — originals and archival prints.
      </p>
    </div>

    <div class="footer-meta">
      <div>hello@alicevanwouw.com</div>
      <div>Johannesburg, South Africa</div>
      <div>Instagram / Shop / Contact</div>
    </div>
  </div>
</footer>

</body>
</html>
